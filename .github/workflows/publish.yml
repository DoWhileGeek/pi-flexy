name: Publish npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'DoWhileGeek/pi-flexy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.15.0
      - name: Verify release identity and version
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - run: npm ci --ignore-scripts
      # prepublishOnly runs typecheck, tests, and the tarball allowlist check.
      # npm uses GitHub OIDC; do not configure a long-lived NPM_TOKEN here.
      - name: Publish with provenance through npm trusted publishing
        run: npm publish --access public
